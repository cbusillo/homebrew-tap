name: Update formulae

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  calculate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      update: ${{ steps.version.outputs.update }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      # This action checks out github.sha itself and replaces the workspace.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1

      - name: Calculate the upstream version
        id: version
        run: |
          set -euo pipefail
          node --version
          brew --version
          brew trust cbusillo/tap
          CALCULATION_DIR="$RUNNER_TEMP/homebrew-candidate"
          mkdir "$CALCULATION_DIR"
          brew livecheck --json --full-name --formula cbusillo/tap/bd-to-avp > "$CALCULATION_DIR/livecheck.json"
          node scripts/updater-proposal.mjs select "$CALCULATION_DIR/livecheck.json"

      - name: Calculate and audit a file-only update
        if: steps.version.outputs.update == 'true'
        env:
          LATEST_VERSION: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          brew bump-formula-pr --write-only --strict --online "--version=$LATEST_VERSION" cbusillo/tap/bd-to-avp
          git diff --check
          CALCULATION_DIR="$RUNNER_TEMP/homebrew-candidate"
          node scripts/updater-proposal.mjs package "$CALCULATION_DIR/livecheck.json" "$CALCULATION_DIR/candidate.json"

      - name: Upload calculation data
        if: steps.version.outputs.update == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homebrew-candidate/candidate.json
          if-no-files-found: error
          retention-days: 7

  submit:
    needs: calculate
    if: needs.calculate.outputs.update == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted run source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's calculation data outside the checkout
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homebrew-candidate

      - name: Validate data and construct the bounded proposal
        id: prepare
        run: |
          set -euo pipefail
          node --version
          node scripts/updater-proposal.mjs prepare "$RUNNER_TEMP/homebrew-candidate" "$RUNNER_TEMP/updater-request.json"

      - name: Request an App-authored proposal
        id: proposal
        uses: cbusillo/launchplane/.github/actions/launchplane-request@f78b143219df32057fde7c8e695c11f32b7f5bfc
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          route-path: /v1/source-control/updater-proposals
          payload-file: ${{ runner.temp }}/updater-request.json
          timeout-ms: '60000'
          output-paths: disposition=disposition,pull_request_url=pull_request_url,head_sha=head_sha
          response-output-file: ${{ runner.temp }}/updater-response.json
          log-response-body: 'false'

      - name: Report the actual proposal outcome
        if: ${{ always() && steps.proposal.outcome != 'skipped' && steps.proposal.outcome != '' }}
        env:
          SUBMIT_OUTCOME: ${{ steps.proposal.outcome }}
          SUBMIT_STATUS: ${{ steps.proposal.outputs.status-code }}
        run: node scripts/updater-proposal.mjs summary "$RUNNER_TEMP/updater-response.json"

      - name: Retain the exact request and available response for recovery
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/updater-request.json
            ${{ runner.temp }}/updater-response.json
          if-no-files-found: error
          retention-days: 7
