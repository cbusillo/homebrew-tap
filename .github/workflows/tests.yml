name: Test formulae

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust tap
        run: brew trust cbusillo/tap

      - name: Install workflow validation tools
        run: brew install actionlint

      - name: Validate repository metadata
        run: jq empty .github/github.json

      - name: Validate workflows
        run: actionlint

      - name: Audit formula
        run: brew audit --strict --online cbusillo/tap/bd-to-avp

      - name: Install formula
        run: brew install --build-from-source cbusillo/tap/bd-to-avp

      - name: Test formula
        run: brew test cbusillo/tap/bd-to-avp

      - name: Check linkage
        run: brew linkage --test cbusillo/tap/bd-to-avp
